name: The Chronicles 24/7 Automated News Wire Daemon

on:
  schedule:
    # 24/7 Continuous Newsroom Heartbeat: executes every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions

concurrency:
  group: news-wire-automation
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Automation Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute News Wire Ingestion Sweep (3.5k - 8k Words Multi-Model Cascade)
        id: news_sweep
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/news_pipeline.py --once --batch-size 8
