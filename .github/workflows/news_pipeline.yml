name: The Chronicles 24/7 Automated News Wire Daemon

on:
  schedule:
    # Runs continuously 24/7 across GitHub Actions runners
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger

concurrency:
  group: news-wire-automation
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Automation Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute News Wire Ingestion Daemon (1-Minute Sweep Loop, 10 News/Min)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/news_pipeline.py --daemon --interval 1 --max-cycles 5 --batch-size 10
