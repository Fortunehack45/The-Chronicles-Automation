name: The Chronicles 24/7 Automated News Wire Daemon

on:
  schedule:
    # Triggers every 10 minutes (backed by continuous internal daemon loops)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger

concurrency:
  group: news-wire-automation
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout Automation Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute News Wire Ingestion Daemon (Every 7–8 Minutes Continuous Loop)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/news_pipeline.py --daemon --interval 8 --max-cycles 5 --batch-size 5
